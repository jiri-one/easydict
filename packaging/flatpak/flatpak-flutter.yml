# Input for flatpak-flutter (https://github.com/TheAppgineer/flatpak-flutter),
# which turns it into the offline manifest one.jiri.easydict.yml for Flathub:
#
#   flatpak-flutter.py flatpak-flutter.yml
#
# Rerun it whenever the tag below, the Flutter version or app/pubspec.lock changes.
id: one.jiri.easydict
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: easydict
finish-args:
  - --socket=pulseaudio
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: easydict
    buildsystem: simple
    subdir: app
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/run/build/easydict/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/easydict/.pub-cache
    build-commands:
      # needs only the SDK's python3
      - ./tool/build_dictionary.sh
      - flutter build linux --release --no-pub
      - cp -r $BUNDLE_PATH /app/easydict
      - mkdir -p /app/bin && ln -s /app/easydict/easydict /app/bin/easydict
      - install -Dm644 -t /app/share/applications ../packaging/linux/one.jiri.easydict.desktop
      - install -Dm644 -t /app/share/metainfo ../packaging/linux/one.jiri.easydict.metainfo.xml
      - install -Dm644 -t /app/share/icons/hicolor/scalable/apps ../packaging/linux/one.jiri.easydict.svg
      - install -Dm644 ../LICENSE /app/share/licenses/one.jiri.easydict/LICENSE
      - install -Dm644 ../data/en-cs/LICENCE /app/share/licenses/one.jiri.easydict/dictionary-GFDL-1.1.txt
      - install -Dm644 assets/dictionary/easydict.sqlite.NOTICE.txt /app/share/licenses/one.jiri.easydict/dictionary-NOTICE.txt
      - install -Dm644 assets/licenses/GPL-2.0.txt /app/share/licenses/one.jiri.easydict/hunspell-cs-GPL-2.0.txt
      - install -Dm644 ../data/README.md /app/share/licenses/one.jiri.easydict/data-sources.md
      - install -Dm644 /var/lib/flutter/LICENSE /app/share/licenses/one.jiri.easydict/flutter-LICENSE
    sources:
      - type: git
        url: https://github.com/jiri-one/easydict.git
        branch: main
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: 3.47.7
        dest: flutter
