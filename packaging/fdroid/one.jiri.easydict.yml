License: GPL-3.0-only
AuthorName: Jiří Němec
WebSite: https://easydict.jiri.one
SourceCode: https://github.com/jiri-one/easydict
IssueTracker: https://github.com/jiri-one/easydict/issues
Changelog: https://github.com/jiri-one/easydict/releases

AutoName: EasyDict

RepoType: git
Repo: https://github.com/jiri-one/easydict.git

Builds:
  - versionName: 1.0.0
    versionCode: 2001
    commit: v1.0.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y python3
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.47.7
    rm:
      - app/linux
      - app/macos
      - app/windows
      - web
    prebuild:
      - sdkmanager 'cmake;3.22.1'
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sed -i -e '/signingConfig = /d' android/app/build.gradle.kts
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - ./tool/build_dictionary.sh
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
    ndk: r28c

