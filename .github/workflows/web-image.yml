name: Website image

# The M1S runs the pushed image and takes a new one every night (podman auto-update), so what
# reaches main goes live. app/ and data/ are in the image too: the page /app and the dictionary.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "app/**"
      - "data/**"
      - ".dockerignore"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/web-tests.yml

  image:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/deploy/Containerfile
          platforms: linux/arm64
          push: true
          # the Flutter SDK of the web app stage is a big download
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/easydict-web:latest
            ghcr.io/${{ github.repository_owner }}/easydict-web:${{ github.sha }}
