name: Website image

# Build the arm64 production image of easydict.jiri.one (web/deploy/Containerfile)
# when the website changes on main and push it to ghcr.io/<owner>/easydict-web.
# The M1S picks it up with `podman auto-update`.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: web
          file: web/deploy/Containerfile
          platforms: linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/easydict-web:latest
            ghcr.io/${{ github.repository_owner }}/easydict-web:${{ github.sha }}
