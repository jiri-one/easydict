name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Dictionary data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y python3-icu python3-pytest
      - name: The dictionary is sorted
        run: data/en-cs/test.sh
      - name: Tests of the tools
        run: python3 -m pytest data/tests
      - name: Build the database
        run: python3 data/tools/build_db.py data/build/easydict.sqlite

  app:
    name: App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: ./tool/build_dictionary.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build the web app
        run: ./tool/build_web.sh

  web:
    name: Website
    uses: ./.github/workflows/web-tests.yml
