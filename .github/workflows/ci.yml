name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Dictionary data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y python3-icu python3-pytest
      - name: The dictionary is sorted
        run: data/en-cs/test.sh
      - name: Tests of the tools
        run: python3 -m pytest data/tests
      - name: Build the database
        run: python3 data/tools/build_db.py data/build/easydict.sqlite

  app:
    name: App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the date of the dictionary copy comes from the history of data/
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: ./tool/build_dictionary.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build the web app
        run: ./tool/build_pages.sh
      - name: The copy of the dictionary in a browser
        run: ./tool/check_copy.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: web-app
          path: app/build/web
          if-no-files-found: error

  web:
    name: Website
    uses: ./.github/workflows/web-tests.yml

  # The API deploys nightly; new endpoints must be live before this app uses them.
  deploy:
    name: Cloudflare
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [data, app, web]
    runs-on: ubuntu-24.04
    concurrency:
      group: cloudflare-easydict
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://app.easydict.jiri.one
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: web-app
          path: app/build/web
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.158.0'
          command: deploy
