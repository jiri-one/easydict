name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data:
    name: Dictionary data
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y python3-icu python3-pytest
      - name: The dictionary is sorted
        run: data/en-cs/test.sh
      - name: Tests of the tools
        run: python3 -m pytest data/tests
      - name: Build the database
        run: python3 data/tools/build_db.py data/build/easydict.sqlite

  app:
    name: App
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.7
          channel: stable
      - run: ./tool/build_dictionary.sh
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build the web app
        run: ./tool/build_pages.sh
      - name: The copy of the dictionary in a browser
        run: ./tool/check_copy.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/build/web

  web:
    name: Website
    uses: ./.github/workflows/web-tests.yml

  # the public web app, app.easydict.jiri.one; the website follows at night (web-image.yml), so a
  # new API has to reach main a day before the app starts to use it
  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [data, app, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
