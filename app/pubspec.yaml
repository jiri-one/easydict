name: easydict
description: "The first open-source translator that is completely open, dictionary data included."
publish_to: 'none'

# Keep lib/version.dart in step (a test checks it).
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Only plugins without build hooks or prebuilt binaries, so that F-Droid and
# Flathub can build everything from source and offline.
dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  intl: any
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+2
  url_launcher: ^6.3.3
  vector_graphics: ^1.2.4
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  vector_graphics_compiler: ^1.3.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/licenses/
    - path: assets/logo.svg
      transformers:
        - package: vector_graphics_compiler
          # The optimisers load a native library of the Flutter SDK, and the
          # logo has no masks or clips to optimise.
          args: [--no-optimize-masks, --no-optimize-clips, --no-optimize-overdraw]
    # built by tool/build_dictionary.sh; the web app searches on the server
    - assets/dictionary/easydict.sqlite.NOTICE.txt
    - path: assets/dictionary/easydict.sqlite
      platforms: [android, ios, linux, macos, windows]
    - path: assets/dictionary/easydict.sha256
      platforms: [android, ios, linux, macos, windows]
